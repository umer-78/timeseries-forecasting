name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: The sample data regenerates identically
        run: |
          python tools/make_data.py
          git diff --exit-code data/
      - name: Run the pipeline end to end
        run: |
          forecast describe data/monthly-sales.csv
          forecast compare data/monthly-sales.csv -h2 6 --initial 36 --step 3
          forecast tune data/monthly-sales.csv -h2 12
          forecast chart data/monthly-sales.csv -h2 12 --initial 36 -o /tmp/charts
